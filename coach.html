<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1115" />
  <title>Coach View — Workout Tracker</title>
  <link rel="stylesheet" href="style2.css" />
  <style>
    .coach-header {
      position: sticky; top: 0; z-index: 50;
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }
    .coach-header h1 { margin: 0; font-size: 17px; }
    .coach-main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .coach-section { margin-bottom: 32px; }
    .coach-section h2 {
      font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text-dim); margin: 0 0 12px;
    }
    .filter-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px; margin-bottom: 16px;
    }
    .filter-row label {
      display: block; font-size: 11px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
    }
    .filter-row select, .filter-row input {
      width: 100%; padding: 10px; font-size: 14px; border-radius: 8px;
      border: 1px solid var(--border-strong); background: var(--bg-input);
      color: var(--text); appearance: none;
    }
    .athlete-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .athlete-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px;
    }
    .athlete-card h3 { margin: 0 0 4px; font-size: 16px; }
    .athlete-card .meta {
      font-size: 12px; color: var(--text-dim); margin-bottom: 10px;
    }
    .athlete-card .actions { display: flex; gap: 6px; }
    .athlete-card button {
      flex: 1; padding: 8px; font-size: 12px; font-weight: 600;
      border-radius: 6px; border: 1px solid var(--border-strong);
      background: var(--bg-elevated); color: var(--text); cursor: pointer;
    }
    .athlete-card button:active { border-color: var(--accent); color: var(--accent); }
    .log-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
      background: var(--bg-card); border-radius: 8px; overflow: hidden;
    }
    .log-table th, .log-table td {
      padding: 8px 10px; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .log-table th {
      background: var(--bg-elevated); color: var(--text-dim);
      font-weight: 700; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .log-table tr:last-child td { border-bottom: none; }
    .log-table .grade-cell { text-align: center; font-weight: 700; color: var(--accent); }
    .log-table .notes-cell { font-style: italic; color: var(--text-dim); font-size: 12px; }
    .key-gate {
      max-width: 420px; margin: 80px auto; padding: 24px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    .key-gate h2 { margin: 0 0 16px; font-size: 18px; }
    .key-gate input {
      width: 100%; padding: 14px; font-size: 15px; border-radius: 8px;
      border: 1px solid var(--border-strong); background: var(--bg-input);
      color: var(--text); margin-bottom: 12px;
    }
    .key-gate button {
      width: 100%; padding: 14px; font-size: 15px; font-weight: 700;
      border-radius: 8px; border: none; background: var(--accent);
      color: #fff; cursor: pointer;
    }
    .key-gate .err { color: var(--danger); font-size: 13px; margin-top: 8px; }
    .log-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .log-filters button {
      padding: 6px 12px; font-size: 12px; font-weight: 600;
      border-radius: 999px; border: 1px solid var(--border-strong);
      background: var(--bg-elevated); color: var(--text); cursor: pointer;
    }
    .log-filters button.active {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>

  <!-- Key gate -->
  <section id="keyGate" class="key-gate">
    <h2>Coach Access</h2>
    <input id="coachKeyInput" type="password" placeholder="Enter coach key" />
    <button id="coachKeyBtn">Enter</button>
    <div id="coachKeyErr" class="err"></div>
  </section>

  <!-- Coach view -->
  <section id="coachApp" class="hidden">
    <header class="coach-header">
      <h1>Coach View</h1>
      <div class="header-right">
        <button id="coachRefreshBtn" class="icon-btn" title="Refresh">↻</button>
        <button id="coachLogoutBtn" class="icon-btn" title="Sign out">⏻</button>
      </div>
    </header>

    <main class="coach-main">

      <!-- Athletes section -->
      <section class="coach-section">
        <h2>Athletes</h2>
        <div id="athleteGrid" class="athlete-grid"></div>
      </section>

      <!-- Logs section -->
      <section class="coach-section">
        <h2>Recent Logs</h2>
        <div class="filter-row">
          <div>
            <label>Athlete</label>
            <select id="filterAthlete"><option value="">All</option></select>
          </div>
          <div>
            <label>Plan</label>
            <select id="filterPlan">
              <option value="">All</option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
            </select>
          </div>
          <div>
            <label>Days</label>
            <select id="filterDays">
              <option value="7">Last 7 days</option>
              <option value="30" selected>Last 30 days</option>
              <option value="90">Last 90 days</option>
              <option value="365">Last year</option>
              <option value="99999">All time</option>
            </select>
          </div>
        </div>

        <div class="table-wrap">
          <table class="log-table">
            <thead>
              <tr>
                <th>When</th>
                <th>Athlete</th>
                <th>Plan</th>
                <th>Exercise</th>
                <th>Set</th>
                <th>Weight</th>
                <th>Reps</th>
                <th>Grade</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody id="logTableBody"></tbody>
          </table>
        </div>
      </section>

    </main>
  </section>

  <div id="toast" class="toast hidden"></div>

  <script src="coach.js?v=4"></script>
</body>
</html>
