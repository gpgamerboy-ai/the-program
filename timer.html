<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Timer</title>
  <link rel="stylesheet" href="timer.css?v=8" />
</head>
<body>

  <!-- START SCREEN -->
  <div id="startScreen" class="start-screen">
    <div class="start-card">
      <h1 id="startTitle">Timer</h1>
      <p id="startSubtitle" class="start-sub">Tap to begin</p>
      <button id="startBtn" class="start-btn">START</button>
    </div>
  </div>

  <!-- TIMER SCREEN -->
  <div id="timerApp" class="timer-app hidden">

    <!-- MASTER CLOCK SECTION -->
    <div class="master-section">
      <div id="masterClock" class="master-clock">00:00</div>
      <div class="stat-row">
        <div class="stat">
          <div class="stat-label">ELAPSED</div>
          <div id="statElapsed" class="stat-value">0:00</div>
        </div>
        <div class="stat">
          <div class="stat-label">INTERVAL</div>
          <div id="statInterval" class="stat-value">0/0</div>
        </div>
        <div class="stat">
          <div class="stat-label">REMAINING</div>
          <div id="statRemaining" class="stat-value">0:00</div>
        </div>
      </div>
    </div>

    <!-- SCROLLABLE INTERVAL LIST -->
    <div id="intervalScroll" class="interval-scroll">
      <div class="scroll-padding"></div>
      <div id="intervalList" class="interval-list"></div>
      <div class="scroll-padding"></div>
    </div>

    <!-- CONTROL BAR -->
    <div class="control-bar">
      <button id="hamburgerBtn" class="icon-btn" aria-label="Menu">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
      <button id="pauseBtn" class="icon-btn" aria-label="Pause">
        <svg id="pauseIcon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
        <svg id="playIcon" class="hidden" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6,4 20,12 6,20"/>
        </svg>
      </button>
      <button id="lockBtn" class="icon-btn" aria-label="Lock">
        <svg id="lockOpenIcon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
        </svg>
        <svg id="lockClosedIcon" class="hidden" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </button>
      <button id="restartBtn" class="icon-btn" aria-label="Restart">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7"/>
          <polyline points="3 4 3 10 9 10"/>
        </svg>
      </button>
      <button id="exitBtn" class="icon-btn" aria-label="Exit">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="6" y1="6" x2="18" y2="18"/>
          <line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- LOCK OVERLAY -->
    <div id="lockOverlay" class="lock-overlay hidden">
      <button id="unlockBtn" class="unlock-pill">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Hold to unlock
      </button>
    </div>

  </div>

  <!-- HAMBURGER MENU -->
  <div id="hamburgerMenu" class="menu-overlay hidden">
    <div class="menu-card">
      <button id="menuExit" class="menu-item danger">Exit Timer</button>
      <button id="menuReset" class="menu-item">Reset</button>
      <button id="menuLock" class="menu-item">Lock Interface</button>
      <button id="menuBack" class="menu-item">Back to Timer</button>
    </div>
  </div>

  <!-- INPUT MODAL -->
  <div id="inputModal" class="input-modal hidden">
    <div class="input-card">
      <h2 id="inputPrompt">Enter value</h2>
      <input id="inputField" type="number" inputmode="numeric" placeholder="0" />
      <button id="inputSubmit" class="primary-btn">Save & Continue</button>
    </div>
  </div>

  <!-- COMPLETE MODAL -->
  <div id="completeModal" class="input-modal hidden">
    <div class="input-card">
      <h2>Timer Complete</h2>
      <p id="completeSummary"></p>
      <button id="completeDone" class="primary-btn">Done</button>
    </div>
  </div>

  <div id="errorMsg" class="error-msg hidden"></div>

  <script src="timer.js?v=10"></script>
</body>
</html>
